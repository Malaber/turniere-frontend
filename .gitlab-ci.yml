stages:
  - build
  - test
  - deploy

variables:
  DOCKER_IMAGE_ENVS: "production"

include:
  - local: '/ci/e2e-images.yml'
  - project: 'turniere/turniere-infra'
    file: '/ci/pipeline.yaml'

#eslint:
#  stage: test
#  script:
#    - yarn install
#    - yarn eslint .

frontend e2e:
  stage: test
  tags:
    - docker
  needs:
    - job: build_image
  image: $E2E_PLAYWRIGHT_IMAGE
  services:
    - name: $E2E_POSTGRES_IMAGE
      alias: postgres
    # Production backend server
    - name: $E2E_BACKEND_IMAGE
      alias: backend
      pull_policy: always
      command:
        - bash
        - -lc
        - >
          bundle exec rails db:prepare &&
          bundle exec rails runner
          "user = User.find_or_initialize_by(email: ENV.fetch('TURNIERE_E2E_EMAIL'));
          user.username = ENV.fetch('TURNIERE_E2E_USERNAME');
          user.password = ENV.fetch('TURNIERE_E2E_PASSWORD');
          user.password_confirmation = ENV.fetch('TURNIERE_E2E_PASSWORD');
          user.confirmed_at = Time.current;
          user.uid = user.email;
          user.provider = 'email';
          user.save!" &&
          bundle exec rails s -p 3000 -b 0.0.0.0
    # Production frontend container (the image under test)
    - name: $CI_REGISTRY_IMAGE/production/commits:$CI_COMMIT_SHA
      alias: frontend
  variables:
    FF_NETWORK_PER_BUILD: "true"
    # Postgres
    POSTGRES_DB: turniere_e2e
    POSTGRES_USER: turniere
    POSTGRES_PASSWORD: turniere
    # Backend env (forwarded to all service containers by GitLab CI)
    POSTGRES_URL: postgres://turniere:turniere@postgres:5432/turniere_e2e
    POSTGRES_USERNAME: turniere
    SECRET_KEY_BASE: e2e-secret-key-base
    MAILGUN_API_KEY: e2e-test-api-key
    MAILGUN_DOMAIN: e2e.example.com
    RAILS_LOG_TO_STDOUT: "1"
    RAILS_SERVE_STATIC_FILES: "1"
    RAILS_ENV: production
    # Frontend env
    TURNIERE_API_URL: http://backend:3000
    # Playwright env
    TURNIERE_FRONTEND_URL: http://frontend:80
    TURNIERE_BACKEND_URL: http://backend:3000
    TURNIERE_E2E_EMAIL: e2e@example.com
    TURNIERE_E2E_PASSWORD: password123
    TURNIERE_E2E_USERNAME: e2e-user
    # Bypass proxy for internal service-to-service traffic
    NO_PROXY: backend,frontend,postgres,localhost,127.0.0.1
    no_proxy: backend,frontend,postgres,localhost,127.0.0.1
  rules:
    - if: $SKIP_TEST
      when: never
    - if: $SKIP_E2E
      when: never
    - if: $CI_PIPELINE_SOURCE != "push"
      when: never
    - when: always
  script:
    # global-setup performs bounded backend/frontend readiness and login checks.
    - bash e2e/run-ci.sh
  after_script:
    - mkdir -p screenshots test-results
    - if [ -d e2e/screenshots ]; then cp -a e2e/screenshots/. screenshots/; fi
    - if [ -d e2e/test-results ]; then cp -a e2e/test-results/. test-results/; fi
  artifacts:
    expose_as: 'E2E screenshots'
    when: always
    paths:
      - screenshots/
      - test-results/
    expire_in: 30 days
