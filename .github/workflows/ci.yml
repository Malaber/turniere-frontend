name: CI
'on':
  push:
    branches:
    - main
    - ci/**
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - uses: docker/setup-buildx-action@v4
    - run: pip install invoke==2.2.0
    - run: inv e2e-docker
    - if: always()
      uses: actions/upload-artifact@v7
      with:
        name: frontend-e2e
        path: |-
          e2e/screenshots/
          e2e/test-results/
        retention-days: 30
  publish:
    needs:
    - checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TURNIERE_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: registry
    strategy:
      matrix:
        target:
        - production
    steps:
    - uses: actions/checkout@v7
    - uses: docker/setup-qemu-action@v4
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      with:
        registry: registry.gitlab.com
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    - uses: docker/build-push-action@v7
      with:
        context: .
        file: docker/production/Dockerfile
        build-args: base_commit=${{ github.sha }}
        platforms: linux/amd64,linux/arm64
        tags: |-
          registry.gitlab.com/turniere/turniere-frontend/${{ matrix.target }}/commits:${{ github.sha }}
          registry.gitlab.com/turniere/turniere-frontend/${{ matrix.target }}:latest
          registry.gitlab.com/turniere/turniere-frontend/${{ matrix.target }}/refs:main
        cache-from: type=gha,scope=${{ matrix.target }}
        cache-to: type=gha,mode=max,scope=${{ matrix.target }}
        push: true
  deploy-request:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TURNIERE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: deployment-dispatch
    steps:
    - name: Request infra deployment
      env:
        GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
        VERSION: ${{ github.sha }}
      run: gh api repos/Malaber/turniere-infra/dispatches --method POST -f event_type=image-published -f client_payload[target]=turniere-frontend
        -f client_payload[version]="$VERSION"
