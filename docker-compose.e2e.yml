services:
  postgres:
    image: ${E2E_POSTGRES_IMAGE:?Use inv e2e-docker to load pinned CI images}
    platform: linux/amd64
    environment:
      POSTGRES_DB: turniere_e2e
      POSTGRES_USER: turniere
      POSTGRES_PASSWORD: turniere
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U turniere -d turniere_e2e" ]
      interval: 3s
      timeout: 3s
      retries: 20

  # Run migrations + bootstrap the E2E user, then start the server — all in one
  # container so there is no init-container-exits-prematurely race.
  backend:
    ports:
      - "127.0.0.1:${E2E_BACKEND_PORT:-0}:3000"
    image: ${E2E_BACKEND_IMAGE:?Use inv e2e-docker to load pinned CI images}
    platform: linux/amd64
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      POSTGRES_URL: postgres://turniere:turniere@postgres:5432/turniere_e2e
      POSTGRES_USERNAME: turniere
      POSTGRES_PASSWORD: turniere
      SECRET_KEY_BASE: e2e-secret-key-base-local
      MAILGUN_API_KEY: e2e-test-api-key
      MAILGUN_DOMAIN: e2e.example.com
      RAILS_LOG_TO_STDOUT: "1"
      RAILS_SERVE_STATIC_FILES: "1"
    command:
      - bash
      - -lc
      - |
        set -e
        bundle exec rails db:prepare
        bundle exec rails runner "user = User.find_or_initialize_by(email: ENV.fetch('TURNIERE_E2E_EMAIL', 'e2e@example.com')); user.username = ENV.fetch('TURNIERE_E2E_USERNAME', 'e2e-user'); user.password = ENV.fetch('TURNIERE_E2E_PASSWORD', 'password123'); user.password_confirmation = ENV.fetch('TURNIERE_E2E_PASSWORD', 'password123'); user.confirmed_at = Time.current; user.uid = user.email; user.provider = 'email'; user.save!"
        exec bundle exec rails s -p 3000 -b 0.0.0.0
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -lc 'exec 3<>/dev/tcp/127.0.0.1/3000 && printf "GET /healthz HTTP/1.0\r\n\r\n" >&3 && grep -q "200" <&3'
      interval: 5s
      timeout: 10s
      retries: 90
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
      args:
        base_commit: e2e
    depends_on:
      backend:
        condition: service_healthy
    environment:
      TURNIERE_API_URL: http://backend:3000

  e2e:
    build:
      context: ./e2e
      dockerfile: Dockerfile
      args:
        PLAYWRIGHT_IMAGE: ${E2E_PLAYWRIGHT_IMAGE:?Use inv e2e-docker to load pinned CI images}
    platform: linux/amd64
    depends_on:
      - frontend
    environment:
      TURNIERE_FRONTEND_URL: http://frontend:80
      TURNIERE_BACKEND_URL: http://backend:3000
      TURNIERE_E2E_EMAIL: e2e@example.com
      TURNIERE_E2E_PASSWORD: password123
      TURNIERE_E2E_USERNAME: e2e-user
      TURNIERE_EXPECTED_FRONTEND_VERSION: e2e
    volumes:
      - ./e2e/screenshots:/app/screenshots
      - ./e2e/test-results:/app/test-results
